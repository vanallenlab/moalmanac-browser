server {
    listen 80;
    server_name ca.moalmanac.org www.ca.moalmanac.org;

    # The about page moved to docs.moalmanac.org
    location = /about {
        return 301 https://docs.moalmanac.org/about/;
    }

    location / {
        include proxy_params;
        proxy_pass http://unix:/srv/moalmanac/moalmanac-browser/moalmanac-browser-ca.sock;
    }
}