server {
    listen 80;
    server_name moalmanac.org www.moalmanac.org;

    # Paths from the legacy browser, now served at old.moalmanac.org. 302s, so they don't outlive old.moalmanac.org
    # in browser caches when it is retired.
    location ~ ^/(api|add|amend|approve|approve_submission|assertion|assertions|attribute_definitions|attributes|attributes_within_definition|delete_submission|distinct_attribute_values|export|extension|feature_definitions|features|predictive_implications|select2_search|sources|submit|tokens)(/|$) {
        return 302 https://old.moalmanac.org$request_uri;
    }

    # About, terms, and privacy policy pages moved to docs.moalmanac.org
    location = /about {
        return 301 https://docs.moalmanac.org/about/;
    }
    location = /terms {
        return 301 https://docs.moalmanac.org/about/terms-of-use/;
    }
    location = /privacy_policy {
        return 301 https://docs.moalmanac.org/about/privacy-policy/;
    }

    # The legacy browser's search used ?s=, which this browser does not use
    location = /search {
        if ($arg_s) {
            return 302 https://old.moalmanac.org$request_uri;
        }
        include proxy_params;
        proxy_pass http://unix:/srv/moalmanac/moalmanac-browser/moalmanac-browser-default.sock;
    }

    location / {
        include proxy_params;
        proxy_pass http://unix:/srv/moalmanac/moalmanac-browser/moalmanac-browser-default.sock;
    }
}

# dev.moalmanac.org was this instance's previous name
server {
    listen 80;
    server_name dev.moalmanac.org www.dev.moalmanac.org;

    return 301 $scheme://moalmanac.org$request_uri;
}
